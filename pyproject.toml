[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimpilot"
version = "0.1.0"
description = "AI-powered insurance claims autopilot — Phase 1: Foundation & Ingestion"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19.0",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-ai-translation-text>=1.0.1",
    "azure-cognitiveservices-speech>=1.41.0",
    "azure-storage-blob>=12.23.0",
    "azure-search-documents>=11.6.0",
    "azure-cosmos>=4.9.0",
    "azure-servicebus>=7.14.0",
    "azure-keyvault-secrets>=4.9.0",
    "openai>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=12.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "evaluation*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring live Azure services (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
